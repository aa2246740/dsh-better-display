name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - run: npm ci

      - run: node scripts/check-agents-md.mjs

      - run: npm run typecheck

      - run: npm run lint

      - name: Unit tests
        run: |
          start=$(date +%s)
          npm test -- --reporter=verbose
          code=$?
          end=$(date +%s)
          echo "test_duration_seconds=$((end - start))" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - run: npm run test:coverage

      - run: node scripts/security-audit-report.mjs

      - name: Prepare Harness tree for the compat check
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          H="$RUNNER_TEMP/harness"
          git clone --quiet --depth 1 --branch dsh-v0.2.1-rc.5 https://github.com/deepseek-ai/deepseek-harness.git "$H"
          echo "DSHX_HARNESS=$H" >> "$GITHUB_ENV"

      - name: Build
        run: |
          start=$(date +%s)
          set +e
          npm run build
          code=$?
          set -e
          end=$(date +%s)
          echo "build_duration_seconds=$((end - start))" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - run: node scripts/check-bundle-size.mjs
